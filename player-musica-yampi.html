<!--
Player de música personalizado para integração na Yampi.
O áudio é hospedado separadamente no GitHub Pages:
https://bernardo-ross.github.io/assets-loja/relax.m4a
-->

<audio id="musica-fundo" loop preload="auto" playsinline>
  <source src="https://bernardo-ross.github.io/assets-loja/relax.m4a" type="audio/mp4">
</audio>

<button id="btn-musica" type="button" aria-label="Ligar ou desligar música"
  style="position:fixed !important;bottom:20px !important;left:20px !important;z-index:99999 !important;
         width:46px !important;height:46px !important;border-radius:50% !important;
         border:2px solid #111 !important;background:#fff !important;
         cursor:pointer !important;padding:0 !important;display:flex !important;
         align-items:center !important;justify-content:center !important;
         box-shadow:0 2px 10px rgba(0,0,0,.35) !important;">

  <svg width="22" height="22" viewBox="0 0 24 24"
       style="fill:none !important;stroke:#111 !important;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;">

    <path d="M9 18V5l12-2v13" style="fill:none !important;stroke:#111 !important"></path>
    <circle cx="6" cy="18" r="3" style="fill:none !important;stroke:#111 !important"></circle>
    <circle cx="18" cy="16" r="3" style="fill:none !important;stroke:#111 !important"></circle>
    <line id="risco-musica" x1="3" y1="3" x2="21" y2="21"
          style="display:none;stroke:#111 !important"></line>
  </svg>
</button>

<script>
(function () {
  var audio = document.getElementById('musica-fundo');
  var btn = document.getElementById('btn-musica');
  var risco = document.getElementById('risco-musica');

  var K_TEMPO = 'musica_tempo';
  var K_ESTADO = 'musica_estado';
  var K_TS = 'musica_ts';

  audio.volume = 0.4;

  function ler(k) {
    try {
      return localStorage.getItem(k);
    } catch (e) {
      return null;
    }
  }

  function gravar(k, v) {
    try {
      localStorage.setItem(k, v);
    } catch (e) {}
  }

  function atualizarBotao() {
    risco.style.display = audio.paused ? 'block' : 'none';
  }

  function posicaoAlvo() {
    var t = parseFloat(ler(K_TEMPO)) || 0;
    var ts = parseFloat(ler(K_TS)) || 0;

    if (ts && ler(K_ESTADO) !== 'off') {
      var passou = (Date.now() - ts) / 1000;
      if (passou > 0 && passou < 10) {
        t += passou;
      }
    }

    return t;
  }

  var posicionado = false;

  function pronto(cb) {
    if (audio.readyState >= 1) {
      cb();
    } else {
      audio.addEventListener('loadedmetadata', cb, { once: true });
    }
  }

  function posicionar() {
    if (posicionado) return;

    var t = posicaoAlvo();

    if (t && audio.duration && isFinite(audio.duration)) {
      try {
        audio.currentTime = t % audio.duration;
      } catch (e) {}
    }

    posicionado = true;
  }

  function salvar() {
    if (!posicionado || audio.paused) return;

    gravar(K_TEMPO, audio.currentTime);
    gravar(K_TS, Date.now());
  }

  audio.addEventListener('timeupdate', salvar);
  window.addEventListener('pagehide', salvar);

  audio.addEventListener('play', atualizarBotao);
  audio.addEventListener('pause', atualizarBotao);

  pronto(posicionar);

  function tocar() {
    return new Promise(function (resolve, reject) {
      pronto(function () {
        posicionar();

        audio.play().then(function () {
          gravar(K_ESTADO, 'on');
          atualizarBotao();
          resolve();
        }).catch(function (erro) {
          atualizarBotao();
          reject(erro);
        });
      });
    });
  }

  // Tenta iniciar automaticamente, sem tela de entrada.
  // Se o navegador bloquear o autoplay, aguarda a primeira interação.
  if (ler(K_ESTADO) !== 'off') {
    tocar().catch(function () {
      atualizarBotao();

      var eventos = ['click', 'touchend', 'keydown'];

      var iniciar = function (ev) {
        if (ev && ev.target && btn.contains(ev.target)) {
          return;
        }

        if (ler(K_ESTADO) === 'off') {
          eventos.forEach(function (e) {
            document.removeEventListener(e, iniciar);
          });
          return;
        }

        tocar().then(function () {
          eventos.forEach(function (e) {
            document.removeEventListener(e, iniciar);
          });
        }).catch(function () {});
      };

      eventos.forEach(function (e) {
        document.addEventListener(e, iniciar);
      });
    });
  } else {
    atualizarBotao();
  }

  btn.addEventListener('click', function (ev) {
    ev.stopPropagation();

    if (audio.paused) {
      tocar();
    } else {
      audio.pause();
      gravar(K_ESTADO, 'off');
      atualizarBotao();
    }
  });
})();
</script>
